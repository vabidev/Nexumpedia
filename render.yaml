services:
  - type: web
    name: nexumpedia-staging
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_INDEXING
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: LOGIN_PATH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexumpedia-staging-db
          property: connectionString

databases:
  - name: nexumpedia-staging-db
    plan: free
    postgresMajorVersion: "18"
    databaseName: nexumpedia_staging
    user: nexumpedia
    ipAllowList: []
