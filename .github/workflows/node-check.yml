name: Node check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nexumpedia_test
          POSTGRES_USER: nexumpedia
          POSTGRES_PASSWORD: nexumpedia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexumpedia -d nexumpedia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nexumpedia:nexumpedia@127.0.0.1:5432/nexumpedia_test
      SESSION_SECRET: github-actions-test-secret-0123456789
      PUBLIC_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate application
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end and accessibility tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            visual-review/
          if-no-files-found: ignore
          retention-days: 7
