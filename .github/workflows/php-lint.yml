name: PHP lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check PHP syntax
        shell: sh
        run: |
          set -eu
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
